# Produktoprettelse-v2 Configuration
# This file controls paths, Chrome settings, and API keys for the pipeline

# Paths (relative to project root)
paths:
  input_dir: "data/input"
  output_dir: "data/output"
  cache_dir: "data/cache"
  logs_dir: "logs"
  
  # Legacy cache location for products_cache.json (used by sanitize)
  products_cache: "cache/products_cache.json"
  
  # Output images folders
  images_output: "data/output/images"
  thumbnails_output: "data/output/images/thumbnails"

# Chrome/Selenium settings
chrome:
  binary_path: ""  # Auto-detect if empty; set to explicit path if needed
  headless: true
  timeout_seconds: 30
  retry_without_headless: true

# AI API settings (override with environment variables)
ai:
  api_key: ""  # Set via AI_API_KEY environment variable
  provider: "openai"  # or "anthropic"
  model: "gpt-4"
  max_tokens: 1000
  temperature: 0.7

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  max_bytes: 10485760  # 10 MB per log file
  backup_count: 3
